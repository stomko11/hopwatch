name: hub

on:
  push:
    branches: [main]
    tags: ["hub-v*"]
    paths: ["hub/**", "shared/**", "ui/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", "shared/**"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s hub/tests

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hopwatch-hub
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/hub-v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=hub-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
