name: image

# Builds one multi-arch image and pushes it to ghcr.io and, when the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set, to Docker Hub (with the README as its description).
#   push to main  -> :edge
#   tag vX.Y.Z    -> :latest, :X.Y.Z, :X.Y

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s probe/tests
      - run: python -m unittest discover -s hub/tests
      - run: python -m unittest discover -s launcher/tests

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: names
        run: |
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${{ github.repository_owner }}/hopwatch" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DOCKERHUB" = "true" ]; then echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/hopwatch" >> "$GITHUB_OUTPUT"; fi
          echo "EOF" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.list }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: env.HAS_DOCKERHUB == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/hopwatch
          short-description: "Ping history and MTR evidence per site, and a hub showing what several sites see at once."
          readme-filepath: ./README.md
