# Self-hosted Gitea: after every push to main, run the tests, build the hub image and push it
# to the Gitea container registry. Unraid then only needs Docker -> Check for updates -> Update.
# Needs in the repository (Settings -> Actions):
#   secret   REGISTRY_TOKEN  personal token with package read + write
#   variable REGISTRY        the Gitea address over https, e.g. git.example.com
# (GitHub ignores this folder and uses .github/workflows instead.)
name: hub
on:
  push:
    branches: [main]
    paths: ["hub/**", "ui/**", "shared/**", ".gitea/workflows/hub.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest discover -s hub/tests

      - name: Build and push
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set -e
          IMG="$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/hopwatch-hub"
          VER="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' hub/app/config.py)-${GITHUB_SHA::7}"
          echo "$TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
          docker build --label org.opencontainers.image.version="$VER" -t "$IMG:latest" -t "$IMG:$VER" -f hub/Dockerfile .
          docker push "$IMG:$VER"
          docker push "$IMG:latest"
          docker logout "$REGISTRY"
          echo "Done: $IMG:$VER"
